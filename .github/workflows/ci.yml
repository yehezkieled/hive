name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # --locked: install exactly what uv.lock pins and fail if the lock is
      # stale, so CI can never drift from the versions the VPS runs.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Test
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing
