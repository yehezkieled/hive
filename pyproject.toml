[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hive"
version = "0.1.0"
description = "Multi-maestro AI agent orchestration platform built on Claude Code"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "mcp>=1.0,<2",
    "pgvector>=0.3",
    "pillow>=10",
    "pypdf>=4",
    "voyageai>=0.3",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "python-telegram-bot>=21.0",
    "uvicorn[standard]>=0.29",
    "ptyprocess>=0.7",
    "pyte>=0.8.2",
    "pywebpush>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "testcontainers[postgres]>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
markers = [
    "integration: tests that drive real external processes or services (e.g. a live Harness); skipped in CI. Hermetic multi-component round-trips do NOT use this marker.",
]

[tool.coverage.run]
source = ["src/hive"]

[tool.coverage.report]
# Ratchet floor, not a target. Current coverage ~77.4% (ticket 011);
# raise this when coverage climbs durably, never lower it to pass a build.
fail_under = 75
