# Fleet-up configuration (sourced by scripts/fleet-up.sh as plain shell).
# Copy to ~/.config/hive/fleet-up.conf to override; any variable already set
# in the environment wins over this file. Values below are the captain's
# current defaults. No secrets belong here.

# --- Hive gateway (the desk) -------------------------------------------------
# Under systemd/launchd the service manager owns the gateway; fleet-up only
# asks it to start. On macOS use the launchctl line instead (see docs/fleet-up.md).
GATEWAY_PORT=8480
GATEWAY_START_CMD='systemctl --user start hive-gateway.service'

# --- Hive runtime with Telegram (python -m hive; optional) ------------------
# The full runtime, not a bot-only process; it replaces hive.service. Not
# started without token + allowlist or while another Hive runtime runs.
# Token/allowlist live in ~/.config/hive/telegram.env, never in this file.
RUNTIME_START_CMD='systemctl --user start hive-telegram.service'
RUNTIME_STATUS_CMD='systemctl --user is-active --quiet hive-telegram.service'

# --- broke-no-more -----------------------------------------------------------
BNM_PORT=3001
BNM_DIR="$HOME/apps/broke-no-more"
BNM_START_CMD='npm start -- -p 3001'

# --- Lavish bridge -----------------------------------------------------------
LAVISH_PORT=4388
LAVISH_DIR="$HOME/fm-preview-proxy"
LAVISH_START_CMD='node lavish-proxy.js'

# --- Preview server ----------------------------------------------------------
PREVIEW_PORT=8765
PREVIEW_DIR="$HOME/fm-preview"
PREVIEW_START_CMD='python3 -m http.server 8765 --bind 127.0.0.1'

# --- tailnet-only serve ports ------------------------------------------------
# "<https port>=<local port>" pairs. Always `tailscale serve`, never funnel.
# On WSL, Tailscale runs on Windows: point TAILSCALE_BIN at tailscale.exe.
TAILSCALE_BIN=tailscale
SERVE_MAP='8443=8765 8444=3001 8445=4388 8446=8480'

# --- firstmate (main Claude session in herdr) ----------------------------------
FM_DIR="$HOME/firstmate"
# Launch command from firstmate README "Install and launch" -> Claude Code.
FM_LAUNCH_CMD='claude'
FM_WORKSPACE_LABEL=firstmate
HERDR_BIN=herdr
# Seconds to wait for the herdr server socket after starting it.
HERDR_SERVER_WAIT=20

# --- misc --------------------------------------------------------------------
LOG_DIR="$HOME/.local/state/hive-fleet-up"
# Seconds to wait for a started service to open its port.
PORT_WAIT=30
